<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Checkout | ThreadMaxx</title>
    <meta name="description" content="ThreadMaxx COD and Razorpay checkout with delivery address, WhatsApp number and order summary.">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
      (window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '2104801253414514');
      fbq('track', 'PageView');
    </script>
  </head>
  <body class="light-page">
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2104801253414514&ev=PageView&noscript=1" alt=""></noscript>
    <header id="site-header"></header>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">Secure checkout</span>
          <h1 class="section-title mt-4">Fast, clear, ready to place.</h1>
          <p class="section-copy mt-4">Add delivery details, apply a coupon and choose Cash On Delivery or Razorpay payment.</p>
        </div>
      </section>
      <section class="section pt-0">
        <div class="container checkout-grid">
          <form class="summary-card" id="checkout-form">
            <h2 class="font-black text-2xl mb-5">Delivery Details</h2>
            <div class="form-grid">
              <div class="field"><label for="name">Full name</label><input id="name" name="name" required autocomplete="name"></div>
              <div class="field"><label for="phone">Mobile number</label><input id="phone" name="phone" required inputmode="tel" autocomplete="tel"></div>
              <div class="field"><label for="whatsapp">WhatsApp number</label><input id="whatsapp" name="whatsapp" inputmode="tel"></div>
              <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"></div>
              <div class="field full"><label for="address">Address</label><textarea id="address" name="address" rows="3" required autocomplete="street-address"></textarea></div>
              <div class="field"><label for="city">City</label><input id="city" name="city" required></div>
              <div class="field"><label for="state">State</label><input id="state" name="state" required></div>
              <div class="field"><label for="pincode">Pincode</label><input id="pincode" name="pincode" required inputmode="numeric" autocomplete="postal-code"></div>
              <div class="field"><label for="landmark">Landmark</label><input id="landmark" name="landmark"></div>
            </div>

            <h2 class="font-black text-2xl mt-8 mb-4">Payment Method</h2>
            <label class="payment-card primary">
              <input type="radio" name="paymentMethod" value="COD" checked>
              <span><strong>Cash On Delivery</strong><br><small class="muted">Pay when your ThreadMaxx order arrives.</small></span>
            </label>
            <label class="payment-card mt-3">
              <input type="radio" name="paymentMethod" value="Razorpay">
              <span><strong>Razorpay Online Payment</strong><br><small class="muted">Cards, UPI, wallets and netbanking in test mode.</small></span>
            </label>
            <button class="btn-primary w-full mt-6" type="submit" id="place-order">Place COD order</button>
          </form>

          <aside class="summary-card" id="checkout-summary"></aside>
        </div>
      </section>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <a class="whatsapp-float" id="whatsapp-float" aria-label="Chat on WhatsApp">WA</a>
    <nav class="mobile-nav" id="mobile-nav"></nav>
    <script type="module" src="js/checkout.js"></script>
  </body>
</html>
